name = "teaven-pay"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "40c5cdd4a50968b4e395ec7a001b9f3f"
compatibility_flags = ["nodejs_compat"]

# 本地开发配置
[dev]
port = 8787
local_protocol = "http"

# 环境变量
[vars]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "CNY"
LOG_LEVEL = "info"
ENABLE_CORS = "true"

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "teaven-pay"
database_id = "7de39fde-b84c-46bd-bb0c-01004b6f5200"
# preview_database_id = "16625207-21df-40f6-b5c0-01004b6f5200"

# KV 命名空间配置 (用于缓存) - 暂时禁用
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# preview_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Observability 配置
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Secrets — 通过 wrangler secret put <NAME> 设置，不在此明文存储
# ENCRYPTION_KEY  渠道配置 AES-GCM 加密密钥（32 字节随机串，必填）
# JWT_SECRET      JWT 签名密钥
# ADMIN_PASSWORD  管理员密码
