name = "teaven-pay"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "40c5cdd4a50968b4e395ec7a001b9f3f"
compatibility_flags = ["nodejs_compat"]

# 本地开发配置
[dev]
port = 8787
local_protocol = "http"

# 环境变量
[vars]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "CNY"
LOG_LEVEL = "info"
ENABLE_CORS = "true"

# 限流与登录防爆破（未配置时回退到 src/utils/throttleStore.ts 的默认值）
# 通用 IP 限流：60 秒窗口内同一 IP 177 次
RATE_LIMIT = "177"
RATE_LIMIT_WINDOW = "60"
# 登录接口 IP 限流：60 秒窗口内同一 IP 7 次
LOGIN_RATE_LIMIT = "7"
LOGIN_RATE_LIMIT_WINDOW = "60"
# 登录失败：累计 7 次失败即临时锁定 907 秒（约 15 分钟）
LOGIN_MAX_FAILURES = "7"
LOGIN_LOCKOUT_SECONDS = "907"

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "teaven-pay"
database_id = "7de39fde-b84c-46bd-bb0c-01004b6f5200"
# preview_database_id = "16625207-21df-40f6-b5c0-01004b6f5200"

# KV 命名空间配置 (用于缓存) - 暂时禁用
# 未绑定时限流不会失效：计数自动降级到 D1(throttle_counters, 需执行
# migrations/0005_throttle_counters.sql) → isolate 内存 Map。
# 注意：本项目的限流**不建议**改用 KV。KV 没有原子自增（其实现是
# 「读→内存+1→写回」，并发下会丢计数），且写入是最终一致的（写完后其他
# 节点仍可能读到旧值）。防登录爆破/密码找回爆破要求每次尝试都被计数，
# 因此 D1 的原子 upsert 才是这里的正确后端。KV 只适合能容忍误差的软限流。
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# preview_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Observability 配置
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Secrets — 通过 wrangler secret put <NAME> 设置，不在此明文存储
# ENCRYPTION_KEY  渠道配置 AES-GCM 加密密钥（32 字节随机串，必填）
# JWT_SECRET      JWT 签名密钥（必填，缺失即 fail-fast；同时用于密码找回令牌摘要）
# ADMIN_PASSWORD  管理员密码
# TEAVEN_EMAIL_API_KEY  Teaven Email 发信密钥（需 SEND_MAIL 权限）；未配置时密码找回接口返回 503

# 邮件发信（Teaven Email 服务）：非密钥配置
# [vars]
# TEAVEN_EMAIL_BASE_URL = "https://email.chenyande.com"   # 服务根地址，不填即用该默认值
# TEAVEN_EMAIL_ENDPOINT 为旧配置名，仍兼容（写完整的 /v1/mail/send 会被自动归一化）
